<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalender">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#24170F">
<title>Kalender</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#24170F;--ink:#F7EDE4;--muted:#CDB8A6;--faint:#B09884;
  --glass:rgba(255,236,220,.07);--glass-2:rgba(255,236,220,.11);--line:rgba(255,236,220,.14);--line-2:rgba(255,236,220,.22);
  --well:rgba(36,23,15,.42);--accent:#E0A86E;--accent-ink:#2A1B12;
  --red-bg:rgba(255,110,90,.22);--red-ink:#FFD0C2;--red-line:rgba(255,140,120,.38);
  --amb-bg:rgba(242,180,80,.20);--amb-ink:#FFE0AE;--amb-line:rgba(242,190,100,.38);
  --ok-bg:rgba(120,200,150,.18);--ok-ink:#DDF5E5;--ok-line:rgba(150,220,175,.38);
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.backdrop{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.backdrop span{position:absolute;border-radius:50%}
.b1{left:-160px;top:-200px;width:720px;height:720px;background:#8A5636;filter:blur(140px);opacity:.85}
.b2{right:-180px;top:120px;width:640px;height:640px;background:#C48A57;filter:blur(150px);opacity:.55}
.b3{left:35%;bottom:-260px;width:760px;height:600px;background:#5B3520;filter:blur(140px);opacity:.9}

.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%)}
.shell{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:18px;padding:22px;max-width:1640px;margin:0 auto}

.side{flex:0 0 72px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0;border-radius:24px;align-self:flex-start}
.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin-bottom:6px}
.navb{width:48px;height:48px;border-radius:16px;border:1px solid transparent;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.navb.on{background:var(--glass-2);border-color:var(--line-2);color:var(--ink)}
.navb svg{width:22px;height:22px}

main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:14px}
aside{flex:1 1 300px;min-width:0;max-width:400px;display:flex;flex-direction:column;gap:14px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:24px}
.toolbar h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.toolbar .sub{font-size:13px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--glass-2);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.icon{width:44px;padding:0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.light{background:var(--ink);border-color:var(--ink);color:var(--accent-ink);font-weight:600}
.btn.danger{background:var(--red-bg);border-color:var(--red-line);color:var(--red-ink)}
.btn svg{width:18px;height:18px}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(255,236,220,.08);border:1px solid rgba(255,236,220,.12)}
.seg button{height:36px;padding:0 14px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-weight:500}
.seg button.on{background:rgba(255,236,220,.22);color:#FFFFFF}

.toast{align-self:flex-start;padding:10px 14px;border-radius:14px;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink);font-size:13px;font-weight:500}

.editor{padding:16px;border-radius:22px;background:rgba(255,236,220,.10);border:1px solid rgba(255,236,220,.20);-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%);display:flex;flex-direction:column;gap:14px}
.fields{display:flex;flex-wrap:wrap;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld.grow{flex:1 1 220px}
.in{height:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,236,220,.20);background:var(--well);color:var(--ink);font-size:14px;min-width:0}
.in.title{font-size:15px;font-weight:600}
textarea.in{height:auto;padding:12px 14px;line-height:1.65;resize:vertical;width:100%}
.in::placeholder{color:var(--faint)}
.pal{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sw{width:32px;height:32px;border-radius:16px;border:none;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sw.custom{position:relative;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px dashed rgba(255,236,220,.35);color:var(--muted)}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.copy{padding:14px;border-radius:16px;background:var(--well);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.chip{height:44px;min-width:76px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:500;background:rgba(255,236,220,.08);color:var(--ink);border:1px solid rgba(255,236,220,.18)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--red-ink)}

.days{display:grid;gap:10px}
.day{min-height:560px;padding:12px 10px;border-radius:22px;display:flex;flex-direction:column;gap:8px;transition:background .15s}
.day.over{background:rgba(255,236,220,.16)}
.dh{display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:8px;border-bottom:1px solid rgba(255,236,220,.10)}
.dh .nm{font-size:12px;color:var(--muted);font-weight:500}
.dh .num{font-size:20px;font-weight:700;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.dh.today .num{background:var(--ink);color:var(--accent-ink)}
.flag{font-size:11px;font-weight:600;color:var(--red-ink);background:var(--red-bg);border:1px solid var(--red-line);border-radius:8px;padding:2px 7px}
.zone{flex:1;display:flex;flex-direction:column;gap:8px;min-height:120px;border-radius:14px;cursor:copy}
.card{width:100%;text-align:left;color:#FFF7F0;padding:10px 11px;border-radius:16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer}
.card .t{display:block;font-weight:600;font-size:13px;line-height:1.3;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.card .m{display:block;font-size:12px;opacity:.82;margin-top:3px}
.card.sel{box-shadow:0 0 0 2px var(--ink)}
.card.fresh{box-shadow:0 0 0 2px var(--accent)}
.wide .card{padding:12px 14px}.wide .card .t{font-size:15px}

.panel{padding:18px;border-radius:24px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0 0 4px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:18px;height:18px}
.dl{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:rgba(36,23,15,.35);border:1px solid rgba(255,236,220,.10)}
.dl .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dl .tt b{font-weight:600;font-size:14px;overflow-wrap:break-word}
.dl .tt span{font-size:12px;color:var(--muted)}
.dl.done .tt b{text-decoration:line-through;color:var(--faint)}
.chk{width:24px;height:24px;border-radius:8px;border:1.5px solid rgba(255,236,220,.35);background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;color:var(--accent-ink)}
.done .chk{background:#7FD3A4;border-color:#7FD3A4}
.badge{font-size:12px;font-weight:600;border-radius:10px;padding:4px 9px;white-space:nowrap;border:1px solid}
.badge.red{background:var(--red-bg);color:var(--red-ink);border-color:var(--red-line)}
.badge.amb{background:var(--amb-bg);color:var(--amb-ink);border-color:var(--amb-line)}
.badge.calm{background:rgba(255,236,220,.10);color:#E9D9CA;border-color:rgba(255,236,220,.18)}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.x{width:32px;height:32px;border-radius:10px;border:none;background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;padding:0}
.x svg{width:16px;height:16px}
.status{font-size:12px;color:var(--muted);text-align:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:760px){
  .shell{padding:12px;gap:12px}
  .side{display:none}
  .toolbar h1{font-size:22px}
  .day{min-height:360px;padding:10px 8px;border-radius:18px}
  aside{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>
<div class="shell">
  <nav class="side glass" aria-label="Hovedmeny">
    <div class="logo" aria-hidden="true">M</div>
    <button class="navb on" aria-label="Kalender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></button>
    <button class="navb" id="navDl" aria-label="Gå til frister"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></button>
    <button class="navb" id="navNt" aria-label="Gå til notater"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></button>
    <button class="navb" id="navAc" aria-label="Konto og synk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.5-3.5 4.3-5 7.5-5s6 1.5 7.5 5"/></svg></button>
  </nav>

  <main>
    <div class="toolbar glass">
      <div><h1 id="mt"></h1><div class="sub" id="rt"></div></div>
      <div class="tools">
        <button class="btn primary" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ny</button>
        <div class="seg" role="group" aria-label="Visning"><button id="vw">Uke</button><button id="v3">3 dager</button></div>
        <button class="btn" id="td">I dag</button>
        <button class="btn icon" id="pv" aria-label="Tilbake"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="btn icon" id="nx" aria-label="Fremover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div id="toast"></div>
    <div id="ed"></div>
    <div class="days" id="days"></div>
  </main>

  <aside>
    <section class="panel glass" id="dlPanel" aria-labelledby="dlh">
      <h2 id="dlh"><svg viewBox="0 0 24 24" fill="none" stroke="#FFB39E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Frister</h2>
      <div id="dls"></div>
      <div class="row">
        <label class="sr-only" for="ft">Hva skal leveres</label>
        <input class="in" id="ft" style="flex:1 1 160px" placeholder="Hva skal leveres?">
        <label class="sr-only" for="fd">Dato</label>
        <input class="in" id="fd" type="date">
        <label class="sr-only" for="fk">Klokkeslett</label>
        <input class="in" id="fk" type="time" value="23:59">
        <button class="btn light" id="fa">Legg til</button>
      </div>
      <div class="err" id="fe" role="alert"></div>
    </section>

    <section class="panel glass" id="ntPanel" aria-labelledby="nth">
      <h2 id="nth"><svg viewBox="0 0 24 24" fill="none" stroke="#E9D9CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span id="ntt">Notater</span></h2>
      <label class="hint" for="na">Viktig denne uken</label>
      <textarea class="in" id="na" rows="7" placeholder="Skriv det som er viktig denne uken…"></textarea>
    </section>

    <section class="panel glass" id="acPanel" aria-label="Konto og synk">
      <div id="acct"></div>
      <div class="status" id="status" role="status"></div>
    </section>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
/* ---------- small helpers ---------- */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monOf=d=>add(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-((d.getDay()+6)%7));
const iso=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const k=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-k);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)}};
const weekId=d=>{const i=iso(d);return i.y+"-W"+pad(i.w)};
const DN=["Søn","Man","Tir","Ons","Tor","Fre","Lør"],DL=["søn","man","tir","ons","tor","fre","lør"];
const MN=["Januar","Februar","Mars","April","Mai","Juni","Juli","August","September","Oktober","November","Desember"];
const lbl=s=>{const d=pd(s);return DL[d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toMin=s=>{const[h,m]=s.split(":").map(Number);return h*60+m};
const dur=e=>{if(!e.start||!e.end)return e.start?"Fra "+e.start:"Hele dagen";const m=toMin(e.end)-toMin(e.start);if(m<=0)return e.start+"–"+e.end;const h=Math.floor(m/60),r=m%60;return e.start+"–"+e.end+" · "+(h?h+"t":"")+(r?(h?" ":"")+r+"m":"")};
const rgb=h=>{const x=parseInt(h.slice(1),16);return[x>>16&255,x>>8&255,x&255]};
const uuid=()=>(crypto&&crypto.randomUUID)?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)});
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const PRESET=["#EF6461","#F28C4A","#F2A54A","#F2C94C","#9BCB5B","#4FC39A","#3FBFB8","#4BB7E5","#5B8DEF","#7C7FF2","#A78BFA","#EE7BB3"];

/* ---------- local data ---------- */
const CACHE="kalender-v1",QKEY="kalender-queue",VKEY="kalender-view";
let data={events:{},deadlines:{},notes:{}};
try{const c=JSON.parse(localStorage.getItem(CACHE)||"null");if(c&&c.events)data=c}catch(e){}
let queue=[];try{queue=JSON.parse(localStorage.getItem(QKEY)||"[]")||[]}catch(e){}
const saveLocal=()=>{try{localStorage.setItem(CACHE,JSON.stringify(data));localStorage.setItem(QKEY,JSON.stringify(queue))}catch(e){}};

/* ---------- view state ---------- */
let n=window.innerWidth<760?3:7;
try{const v=JSON.parse(localStorage.getItem(VKEY)||"null");if(v&&(v.n===3||v.n===7))n=v.n}catch(e){}
let vs=n===7?monOf(today()):today();
let open=null,copyOpen=false,copySel=new Set(),fresh=new Set(),toastTimer=null;
let lastColor=PRESET[8];

/* ---------- sync (Supabase) ---------- */
const cfg=window.CAL_CONFIG||{};
const sb=(cfg.url&&cfg.key&&window.supabase&&window.supabase.createClient)?window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let user=null,pushing=false,pushTimer=null;
const TABLE={events:"cal_events",deadlines:"cal_deadlines",notes:"cal_notes"};
const setStatus=t=>{$("status").textContent=t};
function enqueue(kind,key,op){
  const ix=queue.findIndex(q=>q.kind===kind&&q.key===key);
  const v=(ix>=0?queue[ix].v:0)+1;
  const item={kind,key,op,v};
  if(ix>=0)queue[ix]=item;else queue.push(item);
  saveLocal();
  if(!user){setStatus(sb?"Lagret på denne enheten. Logg inn for å synke.":"Lagret på denne enheten");return}
  setStatus("Lagrer…");clearTimeout(pushTimer);pushTimer=setTimeout(push,700);
}
function toRow(kind,key){
  if(kind==="events"){const e=data.events[key];return e&&{id:e.id,user_id:user.id,day:e.day,title:e.title,start_time:e.start||"",end_time:e.end||"",color:e.color,updated_at:new Date().toISOString()}}
  if(kind==="deadlines"){const f=data.deadlines[key];return f&&{id:f.id,user_id:user.id,title:f.title,due_date:f.date,due_time:f.time||"23:59",done:!!f.done,updated_at:new Date().toISOString()}}
  if(kind==="notes"){return{user_id:user.id,week_id:key,body:data.notes[key]||"",updated_at:new Date().toISOString()}}
}
async function push(){
  if(!user||pushing||!queue.length)return;
  pushing=true;
  try{
    while(queue.length&&user){
      const q=queue[0],v=q.v;let res;
      if(q.op==="delete"){
        res=q.kind==="notes"?await sb.from(TABLE.notes).delete().eq("week_id",q.key):await sb.from(TABLE[q.kind]).delete().eq("id",q.key);
      }else{
        const row=toRow(q.kind,q.key);
        if(!row){res={error:null}}
        else res=await sb.from(TABLE[q.kind]).upsert(row,{onConflict:q.kind==="notes"?"user_id,week_id":"id"});
      }
      if(res.error)throw res.error;
      const ix=queue.findIndex(x=>x.kind===q.kind&&x.key===q.key);
      if(ix>=0&&queue[ix].v===v)queue.splice(ix,1);
      saveLocal();
    }
    setStatus("Synket");
  }catch(e){
    setStatus(navigator.onLine?"Kunne ikke synke: "+(e.message||"ukjent feil"):"Frakoblet. Endringene synkes når du er på nett igjen.");
  }
  pushing=false;
}
async function fetchAll(table){
  const out=[];let from=0;
  for(;;){const r=await sb.from(table).select("*").range(from,from+999);if(r.error)throw r.error;out.push(...r.data);if(r.data.length<1000)break;from+=1000}
  return out;
}
async function pull(){
  if(!user)return;
  try{
    const[ev,dl,nt]=await Promise.all([fetchAll(TABLE.events),fetchAll(TABLE.deadlines),fetchAll(TABLE.notes)]);
    const pend=k=>new Set(queue.filter(q=>q.kind===k).map(q=>q.key));
    const pe=pend("events"),pdl=pend("deadlines"),pn=pend("notes");
    const E={};Object.values(data.events).forEach(e=>{if(pe.has(e.id))E[e.id]=e});
    ev.forEach(r=>{if(!pe.has(r.id))E[r.id]={id:r.id,day:String(r.day),title:r.title,start:r.start_time||"",end:r.end_time||"",color:r.color}});
    const D={};Object.values(data.deadlines).forEach(f=>{if(pdl.has(f.id))D[f.id]=f});
    dl.forEach(r=>{if(!pdl.has(r.id))D[r.id]={id:r.id,title:r.title,date:String(r.due_date),time:r.due_time||"23:59",done:!!r.done}});
    const N={};Object.keys(data.notes).forEach(k=>{if(pn.has(k))N[k]=data.notes[k]});
    nt.forEach(r=>{if(!pn.has(r.week_id))N[r.week_id]=r.body||""});
    data={events:E,deadlines:D,notes:N};saveLocal();renderAll();
    if(queue.length)push();else setStatus("Synket");
  }catch(e){
    setStatus(navigator.onLine?"Kunne ikke hente: "+(e.message||"ukjent feil"):"Frakoblet. Viser det som er lagret på denne enheten.");
  }
}

/* ---------- account panel ---------- */
function renderAccount(msg){
  const el=$("acct");
  if(!sb){el.innerHTML='<p class="hint" style="margin:0">Synk er ikke satt opp. Legg inn Supabase-detaljene i config.js.</p>';return}
  if(user){
    el.innerHTML='<p class="hint" style="margin:0 0 10px">Synker som <b style="color:var(--ink)">'+esc(user.email||"")+'</b></p><div class="row"><button class="btn" id="syncNow">Synk nå</button><button class="btn" id="logout">Logg ut</button></div>';
    $("syncNow").onclick=()=>{setStatus("Synker…");pull()};
    $("logout").onclick=async()=>{if(!confirm("Logge ut? Dataene dine ligger trygt i kontoen din."))return;await sb.auth.signOut()};
    return;
  }
  el.innerHTML='<p style="margin:0 0 10px;font-weight:700;font-size:16px">Logg inn for å synke</p>'+
    '<div class="fld" style="margin-bottom:8px"><label for="em">E-post</label><input class="in" id="em" type="email" autocomplete="email" inputmode="email"></div>'+
    '<div class="fld" style="margin-bottom:10px"><label for="pw">Passord</label><input class="in" id="pw" type="password" autocomplete="current-password"></div>'+
    '<div class="row"><button class="btn primary" id="login" style="flex:1">Logg inn</button><button class="btn" id="signup" style="flex:1">Opprett konto</button></div>'+
    (msg?'<p class="'+(msg.ok?"hint":"err")+'" role="alert" style="margin:8px 0 0">'+esc(msg.text||msg)+'</p>':'');
  const go=async()=>{const em=$("em").value.trim(),pw=$("pw").value;
    if(!em||!pw){renderAccount("Skriv inn e-post og passord.");return}
    setStatus("Logger inn…");
    const{error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){renderAccount(error.message==="Invalid login credentials"?"Feil e-post eller passord.":error.message);setStatus("Lagret på denne enheten. Logg inn for å synke.")}};
  $("signup").onclick=async()=>{const em=$("em").value.trim(),pw=$("pw").value;
    if(!em||pw.length<6){renderAccount("Skriv e-post og et passord på minst 6 tegn.");return}
    const{data:d,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error){renderAccount(error.message);return}
    if(!d.session)renderAccount({ok:true,text:"Konto opprettet. Åpne e-posten fra Supabase, bekreft den, og logg inn her."})};
  $("login").onclick=go;$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
}

/* ---------- rendering ---------- */
function cardStyle(c){const v=rgb(c).join(",");return"background:rgba("+v+",.30);border:1px solid rgba("+v+",.62)"}
function eventsOn(ds){return Object.values(data.events).filter(e=>e.day===ds).sort((a,b)=>(a.start||"00:00").localeCompare(b.start||"00:00")||a.title.localeCompare(b.title))}
function renderToolbar(){
  const end=add(vs,n-1),w=iso(vs).w;
  $("mt").textContent=MN[vs.getMonth()]+" "+vs.getFullYear();
  $("rt").textContent="Uke "+w+" · "+vs.getDate()+"."+(vs.getMonth()+1)+" – "+end.getDate()+"."+(end.getMonth()+1);
  $("vw").classList.toggle("on",n===7);$("v3").classList.toggle("on",n===3);
  $("vw").setAttribute("aria-pressed",n===7);$("v3").setAttribute("aria-pressed",n===3);
}
function renderDays(){
  const el=$("days"),t=ymd(today());
  el.style.gridTemplateColumns="repeat("+n+",minmax(0,1fr))";el.classList.toggle("wide",n===3);
  let h="";
  for(let i=0;i<n;i++){
    const d=add(vs,i),ds=ymd(d);
    const fl=Object.values(data.deadlines).filter(f=>!f.done&&f.date===ds).length;
    h+='<section class="day glass" aria-label="'+DN[d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)+'"><div class="dh'+(ds===t?" today":"")+'"><span class="nm">'+DN[d.getDay()]+'</span><span class="num">'+d.getDate()+'</span>'+
      (fl?'<span class="flag">'+(fl>1?fl+" frister":"Frist")+'</span>':"")+'</div><div class="zone" data-day="'+ds+'" title="Trykk for ny hendelse">'+
      eventsOn(ds).map(e=>'<button class="card'+(open===e.id?" sel":fresh.has(e.id)?" fresh":"")+'" draggable="true" data-id="'+e.id+'" style="'+cardStyle(e.color)+'"><span class="t">'+esc(e.title||"Uten navn")+'</span><span class="m">'+dur(e)+'</span></button>').join("")+'</div></section>';
  }
  el.innerHTML=h;
}
function badge(f){
  if(f.done)return'<span class="badge ok">Levert</span>';
  const x=Math.round((pd(f.date)-today())/864e5);
  if(x<0)return'<span class="badge red">'+(-x)+" d over fristen</span>";
  if(x===0)return'<span class="badge red">I dag</span>';
  if(x===1)return'<span class="badge amb">I morgen</span>';
  return'<span class="badge '+(x<=3?"amb":"calm")+'">Om '+x+" dager</span>";
}
function renderDeadlines(){
  const list=Object.values(data.deadlines).sort((a,b)=>(a.done-b.done)||(a.date+a.time).localeCompare(b.date+b.time));
  $("dls").innerHTML=list.length?list.map(f=>'<div class="dl'+(f.done?" done":"")+'" style="margin-bottom:8px"><button class="chk" data-f="'+f.id+'" aria-label="'+(f.done?"Marker som ikke levert":"Marker som levert")+'">'+(f.done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':"")+'</button><div class="tt"><b>'+esc(f.title)+'</b><span>'+lbl(f.date)+" kl. "+esc(f.time)+'</span></div>'+badge(f)+'<button class="x" data-x="'+f.id+'" aria-label="Slett frist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>').join(""):'<p class="hint" style="margin:0 0 4px">Ingen frister ennå.</p>';
}
function renderNotes(){
  const k=weekId(vs);$("ntt").textContent="Notater for uke "+iso(vs).w;
  const na=$("na");if(document.activeElement!==na)na.value=data.notes[k]||"";
}
function renderAll(){renderToolbar();renderDays();renderDeadlines();renderNotes();if(open&&!data.events[open]){open=null;renderEditor()}}

/* ---------- editor ---------- */
function usedColors(){const a=[];Object.values(data.events).forEach(e=>{const c=(e.color||"").toLowerCase();if(c&&!a.includes(c))a.push(c)});return a}
function renderEditor(){
  const el=$("ed"),e=open&&data.events[open];
  if(!e){el.innerHTML="";return}
  el.innerHTML='<section class="editor" aria-label="Rediger hendelse">'+
    '<div class="fields"><div class="fld grow"><label for="et">Navn</label><input class="in title" id="et"></div>'+
    '<div class="fld"><label for="eday">Dato</label><input class="in" id="eday" type="date"></div>'+
    '<div class="fld"><label for="es">Start</label><input class="in" id="es" type="time"></div>'+
    '<div class="fld"><label for="ee">Slutt</label><input class="in" id="ee" type="time"></div></div>'+
    '<div class="pal" id="pal" aria-label="Farge"></div>'+
    '<div class="row between"><div class="row"><button class="btn danger" id="del">Slett</button><button class="btn" id="cpo">Kopier</button></div><button class="btn light" id="ok">Ferdig</button></div>'+
    '<div id="cp"></div></section>';
  const t=$("et"),dd=$("eday"),s=$("es"),en=$("ee");
  t.value=e.title;dd.value=e.day;s.value=e.start||"";en.value=e.end||"";
  const save=()=>{enqueue("events",e.id,"upsert");renderDays()};
  t.oninput=()=>{e.title=t.value;save()};
  dd.onchange=()=>{if(dd.value){e.day=dd.value;save();copySel.clear();renderCopy()}};
  s.onchange=()=>{e.start=s.value;if(e.start&&(!e.end||toMin(e.end)<=toMin(e.start))){const m=Math.min(23*60+59,toMin(e.start)+60);e.end=pad(Math.floor(m/60))+":"+pad(m%60);en.value=e.end}if(!e.start){e.end="";en.value=""}save()};
  en.onchange=()=>{if(!en.value||(e.start&&toMin(en.value)>toMin(e.start))){e.end=en.value;save()}else en.value=e.end};
  renderPalette(e);
  $("del").onclick=()=>{const title=e.title;delete data.events[e.id];enqueue("events",e.id,"delete");closeEditor();renderDays();toast("«"+(title||"Uten navn")+"» er slettet")};
  $("ok").onclick=()=>{closeEditor();renderDays()};
  $("cpo").onclick=()=>{copyOpen=!copyOpen;copySel.clear();renderCopy()};
  renderCopy();
}
function renderPalette(e){
  const all=[...new Set([...usedColors(),...PRESET.map(x=>x.toLowerCase())])].slice(0,18);
  const el=$("pal");
  el.innerHTML='<span class="hint" style="margin-right:2px">Farge</span>'+all.map(c=>'<button class="sw'+(c===e.color.toLowerCase()?" on":"")+'" data-c="'+c+'" aria-label="Farge '+c+'" style="background:'+c+'"></button>').join("")+
    '<label class="sw custom" title="Velg hvilken som helst farge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><input type="color" id="ec" aria-label="Velg hvilken som helst farge"></label>';
  const c=$("ec");c.value=e.color;
  c.oninput=()=>{e.color=c.value;lastColor=c.value;renderDays()};
  c.onchange=()=>{e.color=c.value;lastColor=c.value;enqueue("events",e.id,"upsert");renderPalette(e);renderDays()};
  el.onclick=ev=>{const b=ev.target.closest("button.sw");if(!b)return;e.color=b.dataset.c;lastColor=e.color;enqueue("events",e.id,"upsert");renderPalette(e);renderDays()};
}
function renderCopy(){
  const box=$("cp"),e=open&&data.events[open];if(!box||!e)return;
  if(!copyOpen){box.innerHTML="";return}
  const m=monOf(pd(e.day));let chips="";
  for(let w=0;w<2;w++){
    chips+='<div class="hint" style="width:100%">'+(w?"Neste uke (uke "+iso(add(m,7)).w+")":"Denne uken (uke "+iso(m).w+")")+'</div>';
    for(let i=0;i<7;i++){const d=add(m,w*7+i),ds=ymd(d),self=ds===e.day;
      chips+='<button class="chip'+(copySel.has(ds)?" on":"")+'" data-ds="'+ds+'"'+(self?' disabled title="Hendelsen ligger allerede her"':"")+' aria-pressed="'+copySel.has(ds)+'">'+DN[d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)+'</button>'}
  }
  const extra=[...copySel].filter(ds=>{const d=pd(ds);return d<m||d>add(m,13)}).sort();
  box.innerHTML='<div class="copy"><b>Kopier «'+esc(e.title||"Uten navn")+'» til:</b><div class="row">'+chips+'</div>'+
    '<div class="row"><label class="hint" for="cpd">Annen dato:</label><input class="in" id="cpd" type="date"><button class="btn" id="cpa">Legg til dato</button></div>'+
    (extra.length?'<div class="hint">Også: '+extra.map(lbl).join(", ")+'</div>':"")+
    '<div class="row between"><button class="btn" id="cpx">Avbryt</button><button class="btn primary" id="cpg">'+(copySel.size?"Kopier til "+copySel.size+(copySel.size>1?" dager":" dag"):"Velg dager")+'</button></div><div class="err" id="cpe" role="alert"></div></div>';
  box.onclick=ev=>{
    const ch=ev.target.closest(".chip");
    if(ch&&!ch.disabled){const ds=ch.dataset.ds;copySel.has(ds)?copySel.delete(ds):copySel.add(ds);renderCopy();return}
    if(ev.target.closest("#cpa")){const v=$("cpd").value;if(!v){$("cpe").textContent="Velg en dato først";return}if(v===e.day){$("cpe").textContent="Hendelsen ligger allerede på den datoen";return}copySel.add(v);renderCopy();return}
    if(ev.target.closest("#cpx")){copyOpen=false;copySel.clear();renderCopy();return}
    if(ev.target.closest("#cpg")){
      if(!copySel.size){$("cpe").textContent="Velg minst én dag å kopiere til";return}
      const ds=[...copySel].sort();fresh=new Set();
      ds.forEach(d=>{const id=uuid();data.events[id]={id,day:d,title:e.title,start:e.start,end:e.end,color:e.color};fresh.add(id);enqueue("events",id,"upsert")});
      toast("«"+(e.title||"Uten navn")+"» kopiert til "+ds.map(lbl).join(", "));
      closeEditor();renderDays();
      setTimeout(()=>{fresh=new Set();renderDays()},4000);
    }
  };
}
function closeEditor(){open=null;copyOpen=false;copySel.clear();renderEditor()}
function openEditor(id,focus){open=id;copyOpen=false;copySel.clear();renderEditor();renderDays();if(focus){const t=$("et");t.focus();t.select()}$("ed").scrollIntoView({block:"nearest",behavior:"smooth"})}
function newEvent(ds){const id=uuid();data.events[id]={id,day:ds,title:"Ny hendelse",start:"",end:"",color:lastColor};enqueue("events",id,"upsert");openEditor(id,true)}
function toast(msg){$("toast").innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$("toast").innerHTML=""},4000)}

/* ---------- events: calendar ---------- */
$("days").addEventListener("click",ev=>{
  const c=ev.target.closest(".card");if(c){openEditor(c.dataset.id,false);return}
  const z=ev.target.closest(".zone");if(z&&ev.target===z)newEvent(z.dataset.day);
});
let drag=null;
$("days").addEventListener("dragstart",ev=>{const c=ev.target.closest(".card");if(!c)return;drag=c.dataset.id;ev.dataTransfer.effectAllowed="move";ev.dataTransfer.setData("text/plain",drag)});
$("days").addEventListener("dragover",ev=>{const z=ev.target.closest(".day");if(!z||!drag)return;ev.preventDefault();document.querySelectorAll(".day.over").forEach(x=>x!==z&&x.classList.remove("over"));z.classList.add("over")});
$("days").addEventListener("dragleave",ev=>{const z=ev.target.closest(".day");if(z&&!z.contains(ev.relatedTarget))z.classList.remove("over")});
$("days").addEventListener("drop",ev=>{const z=ev.target.closest(".day");if(!z||!drag)return;ev.preventDefault();const e=data.events[drag],ds=z.querySelector(".zone").dataset.day;if(e&&e.day!==ds){e.day=ds;enqueue("events",e.id,"upsert")}drag=null;renderDays();if(open)renderEditor()});
$("days").addEventListener("dragend",()=>{drag=null;document.querySelectorAll(".day.over").forEach(x=>x.classList.remove("over"))});

/* ---------- events: toolbar ---------- */
const saveView=()=>{try{localStorage.setItem(VKEY,JSON.stringify({n}))}catch(e){}};
$("add").onclick=()=>{const t=today();const inView=t>=vs&&t<=add(vs,n-1);newEvent(ymd(inView?t:vs))};
$("vw").onclick=()=>{n=7;vs=monOf(vs);saveView();closeEditor();renderAll()};
$("v3").onclick=()=>{n=3;const m=monOf(vs),t=today();vs=(t>=m&&t<=add(m,6))?t:m;saveView();closeEditor();renderAll()};
$("pv").onclick=()=>{vs=add(vs,-n);closeEditor();renderAll()};
$("nx").onclick=()=>{vs=add(vs,n);closeEditor();renderAll()};
$("td").onclick=()=>{vs=n===7?monOf(today()):today();closeEditor();renderAll()};
$("navDl").onclick=()=>$("dlPanel").scrollIntoView({behavior:"smooth"});
$("navNt").onclick=()=>{$("ntPanel").scrollIntoView({behavior:"smooth"});$("na").focus({preventScroll:true})};
$("navAc").onclick=()=>$("acPanel").scrollIntoView({behavior:"smooth"});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&open){closeEditor();renderDays()}});

/* ---------- events: deadlines ---------- */
$("fd").value=ymd(add(today(),7));
["ft","fd"].forEach(id=>$(id).addEventListener("input",()=>{$("fe").textContent=""}));
const addDeadline=()=>{
  const t=$("ft").value.trim(),d=$("fd").value;
  if(!t){$("fe").textContent="Skriv hva som skal leveres";$("ft").focus();return}
  if(!d){$("fe").textContent="Velg en dato";$("fd").focus();return}
  const id=uuid();data.deadlines[id]={id,title:t,date:d,time:$("fk").value||"23:59",done:false};
  enqueue("deadlines",id,"upsert");$("ft").value="";$("fe").textContent="";renderDeadlines();renderDays();
};
$("fa").onclick=addDeadline;$("ft").addEventListener("keydown",e=>{if(e.key==="Enter")addDeadline()});
$("dls").addEventListener("click",ev=>{
  const ch=ev.target.closest(".chk");if(ch){const f=data.deadlines[ch.dataset.f];if(f){f.done=!f.done;enqueue("deadlines",f.id,"upsert");renderDeadlines();renderDays()}return}
  const x=ev.target.closest(".x");if(x){const f=data.deadlines[x.dataset.x];if(f&&confirm("Slette fristen «"+f.title+"»?")){delete data.deadlines[f.id];enqueue("deadlines",f.id,"delete");renderDeadlines();renderDays()}}
});

/* ---------- events: notes ---------- */
$("na").addEventListener("input",ev=>{const k=weekId(vs);data.notes[k]=ev.target.value;enqueue("notes",k,"upsert")});

/* ---------- start ---------- */
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
if(sb){
  sb.auth.onAuthStateChange((evt,session)=>{
    const was=user&&user.id;user=session?session.user:null;renderAccount();
    if(user&&user.id!==was){setStatus("Synker…");pull()}
    if(!user)setStatus("Lagret på denne enheten. Logg inn for å synke.");
  });
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&user){renderAll();pull()}});
  window.addEventListener("online",()=>{if(user)push()});
  setInterval(()=>{if(!document.hidden&&user)pull()},60000);
}else setStatus("Lagret på denne enheten");
renderAccount();renderAll();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
</body>
</html>
