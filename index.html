<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalender">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#24170F">
<title>Kalender</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#24170F;--ink:#F7EDE4;--muted:#CDB8A6;--faint:#B09884;
  --glass:rgba(255,236,220,.07);--glass-2:rgba(255,236,220,.11);--line:rgba(255,236,220,.14);--line-2:rgba(255,236,220,.22);
  --well:rgba(36,23,15,.42);--accent:#E0A86E;--accent-ink:#2A1B12;
  --red-bg:rgba(255,110,90,.22);--red-ink:#FFD0C2;--red-line:rgba(255,140,120,.38);
  --amb-bg:rgba(242,180,80,.20);--amb-ink:#FFE0AE;--amb-line:rgba(242,190,100,.38);
  --ok-bg:rgba(120,200,150,.18);--ok-ink:#DDF5E5;--ok-line:rgba(150,220,175,.38);
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.backdrop{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.backdrop span{position:absolute;border-radius:50%}
.b1{left:-160px;top:-200px;width:720px;height:720px;background:#8A5636;filter:blur(140px);opacity:.85}
.b2{right:-180px;top:120px;width:640px;height:640px;background:#C48A57;filter:blur(150px);opacity:.55}
.b3{left:35%;bottom:-260px;width:760px;height:600px;background:#5B3520;filter:blur(140px);opacity:.9}

.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%)}
.shell{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:18px;padding:22px;max-width:1640px;margin:0 auto}

.side{flex:0 0 72px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0;border-radius:24px;align-self:flex-start}
.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin-bottom:6px}
.navb{width:48px;height:48px;border-radius:16px;border:1px solid transparent;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.navb.on{background:var(--glass-2);border-color:var(--line-2);color:var(--ink)}
.navb svg{width:22px;height:22px}

main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:14px}
aside{flex:1 1 300px;min-width:0;max-width:400px;display:flex;flex-direction:column;gap:14px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:24px}
.toolbar h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.toolbar .sub{font-size:13px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--glass-2);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.icon{width:44px;padding:0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.light{background:var(--ink);border-color:var(--ink);color:var(--accent-ink);font-weight:600}
.btn.danger{background:var(--red-bg);border-color:var(--red-line);color:var(--red-ink)}
.btn svg{width:18px;height:18px}
.seg{display:flex;padding:4px;border-radius:14px;background:rgba(255,236,220,.08);border:1px solid rgba(255,236,220,.12)}
.seg button{height:36px;padding:0 14px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-weight:500}
.seg button.on{background:rgba(255,236,220,.22);color:#FFFFFF}

.toast{align-self:flex-start;padding:10px 14px;border-radius:14px;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink);font-size:13px;font-weight:500}

.editor{padding:16px;border-radius:22px;background:rgba(255,236,220,.10);border:1px solid rgba(255,236,220,.20);-webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%);display:flex;flex-direction:column;gap:14px}
.fields{display:flex;flex-wrap:wrap;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld.grow{flex:1 1 220px}
.in{height:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,236,220,.20);background:var(--well);color:var(--ink);font-size:14px;min-width:0}
.in.title{font-size:15px;font-weight:600}
textarea.in{height:auto;padding:12px 14px;line-height:1.65;resize:vertical;width:100%}
.in::placeholder{color:var(--faint)}
.pal{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sw{width:32px;height:32px;border-radius:16px;border:none;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.sw.custom{position:relative;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px dashed rgba(255,236,220,.35);color:var(--muted)}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.copy{padding:14px;border-radius:16px;background:var(--well);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.chip{height:44px;min-width:76px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:500;background:rgba(255,236,220,.08);color:var(--ink);border:1px solid rgba(255,236,220,.18)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:var(--red-ink)}

.days{border-radius:22px;padding:10px 10px 14px 0}
.tgrid{display:grid;column-gap:6px}
.dh{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 8px}
.dh .nm{font-size:12px;color:var(--muted);font-weight:500}
.dh .num{font-size:20px;font-weight:700;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.dh.today .num{background:var(--ink);color:var(--accent-ink)}
.flag{font-size:11px;font-weight:600;color:var(--red-ink);background:var(--red-bg);border:1px solid var(--red-line);border-radius:8px;padding:2px 7px}
.allrow{padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid rgba(255,236,220,.10)}
.allday{display:flex;flex-direction:column;gap:4px;min-width:0}
.tlab{position:relative}
.tlab span{position:absolute;right:8px;font-size:11px;color:var(--faint);transform:translateY(-7px);font-variant-numeric:tabular-nums}
.tcol{position:relative;border-left:1px solid rgba(255,236,220,.08);cursor:copy;transition:background .15s}
.tcol.over{background:rgba(255,236,220,.08)}
.hline{position:absolute;left:0;right:0;border-top:1px solid rgba(255,236,220,.07);pointer-events:none}
.hline.half{border-top:1px dashed rgba(255,236,220,.035)}
.card{position:absolute;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;color:#FFF7F0;padding:5px 7px;border-radius:10px;overflow:hidden;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:1}
.card .t{display:block;font-weight:600;font-size:12px;line-height:1.25;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.card .m{display:block;font-size:11px;opacity:.82;margin-top:2px}
.card.mini{padding:1px 6px;flex-direction:row;gap:5px;align-items:center;white-space:nowrap}
.card.mini .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.card.mini .m{margin:0;flex:none;font-weight:600}
.card.ad{position:static;width:100%;padding:4px 8px;border-radius:8px}
.card.sel{box-shadow:0 0 0 2px var(--ink);z-index:3}
.card.fresh{box-shadow:0 0 0 2px var(--accent);z-index:2}
.wide .card .t{font-size:14px}
.nowl{position:absolute;left:-1px;right:0;border-top:2px solid #FF8A75;z-index:4;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:4px;background:#FF8A75}

.panel{padding:18px;border-radius:24px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0 0 4px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:18px;height:18px}
.dl{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:rgba(36,23,15,.35);border:1px solid rgba(255,236,220,.10)}
.dl .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dl .tt b{font-weight:600;font-size:14px;overflow-wrap:break-word}
.dl .tt span{font-size:12px;color:var(--muted)}
.dl.done .tt b{text-decoration:line-through;color:var(--faint)}
.chk{width:24px;height:24px;border-radius:8px;border:1.5px solid rgba(255,236,220,.35);background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;color:var(--accent-ink)}
.done .chk{background:#7FD3A4;border-color:#7FD3A4}
.badge{font-size:12px;font-weight:600;border-radius:10px;padding:4px 9px;white-space:nowrap;border:1px solid}
.badge.red{background:var(--red-bg);color:var(--red-ink);border-color:var(--red-line)}
.badge.amb{background:var(--amb-bg);color:var(--amb-ink);border-color:var(--amb-line)}
.badge.calm{background:rgba(255,236,220,.10);color:#E9D9CA;border-color:rgba(255,236,220,.18)}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok-line)}
.x{width:32px;height:32px;border-radius:10px;border:none;background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;padding:0}
.x svg{width:16px;height:16px}
.status{font-size:12px;color:var(--muted);text-align:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dcard{min-height:170px;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;background:rgba(36,23,15,.35);border:1px solid rgba(255,236,220,.12)}
.dcard.pinned{border-color:rgba(224,168,110,.6);background:rgba(224,168,110,.10)}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dtitle{font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.dwhen{font-size:12px;color:var(--muted)}
.dcard .badge{align-self:flex-start;margin-top:auto}
.dcard.done .dtitle{text-decoration:line-through;color:var(--faint)}
.pin{width:32px;height:32px;border-radius:10px;border:none;background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;padding:0}
.pin svg{width:17px;height:17px}
.pin.on{color:var(--accent);background:rgba(224,168,110,.16)}
.pin.on svg path{fill:currentColor}
.dform{margin-top:6px}
.pinopt{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,236,220,.20);background:var(--well);color:var(--ink);font-size:13px;cursor:pointer}
.pinopt input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.exhero{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}
.exbig{font-size:52px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.exmeta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.exmeta svg{width:15px;height:15px;flex:none}
.excard{min-height:170px;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.excard .dtop{margin-bottom:2px}
.extype{font-size:11px;font-weight:600;border-radius:7px;padding:2px 8px;background:rgba(255,236,220,.12);color:#E9D9CA}
.excard .badge{align-self:flex-start;margin-top:auto}
.excard.past{opacity:.6;min-height:0}
.excard.past .dtitle{text-decoration:line-through}
.excard.editing{box-shadow:0 0 0 2px var(--ink)}
.exflag{font-size:11px;font-weight:600;color:#2A1B12;background:var(--accent);border-radius:8px;padding:2px 7px}
select.in{padding-right:8px}
@media (max-width:760px){
  .shell{padding:12px;gap:12px}
  .side{display:none}
  .toolbar h1{font-size:22px}
  .days{padding:8px 6px 10px 0;border-radius:18px}
  .tlab span{right:4px;font-size:10px}
  .tgrid{column-gap:4px}
  .card{padding:4px 5px;border-radius:8px}
  .card .t,.wide .card .t{font-size:11px;line-height:1.2}
  .card .m{font-size:10px}
  aside{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>
<div class="shell">
  <nav class="side glass" aria-label="Hovedmeny">
    <div class="logo" aria-hidden="true">M</div>
    <button class="navb on" id="navCal" aria-label="Kalender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></button>
    <button class="navb" id="navEx" aria-label="Eksamener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5L12 5l9.5 4.5L12 14z"/><path d="M6.5 11.5v4.5c1.5 1.6 3.4 2.5 5.5 2.5s4-.9 5.5-2.5v-4.5"/><path d="M21.5 9.5v5"/></svg></button>
    <button class="navb" id="navDl" aria-label="Gå til frister"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></button>
    <button class="navb" id="navNt" aria-label="Gå til notater"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></button>
    <button class="navb" id="navAc" aria-label="Konto og synk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.5-3.5 4.3-5 7.5-5s6 1.5 7.5 5"/></svg></button>
  </nav>

  <main>
    <div class="toolbar glass">
      <div><h1 id="mt"></h1><div class="sub" id="rt"></div></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Side"><button id="tabCal">Kalender</button><button id="tabEx">Eksamener</button></div>
        <div class="tools" id="calTools">
        <button class="btn primary" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ny</button>
        <div class="seg" role="group" aria-label="Visning"><button id="vw">Uke</button><button id="v3">3 dager</button></div>
        <button class="btn" id="td">I dag</button>
        <button class="btn icon" id="pv" aria-label="Tilbake"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="btn icon" id="nx" aria-label="Fremover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="ed"></div>
    <div class="days glass" id="days"></div>

    <section class="panel glass" id="dlPanel" aria-labelledby="dlh">
      <div class="row between">
        <h2 id="dlh"><svg viewBox="0 0 24 24" fill="none" stroke="#FFB39E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Frister</h2>
        <span class="hint" id="dlsub"></span>
      </div>
      <div class="dgrid" id="dls"></div>
      <div class="row dform">
        <label class="sr-only" for="ft">Hva skal leveres</label>
        <input class="in" id="ft" style="flex:1 1 200px" placeholder="Hva skal leveres?">
        <label class="sr-only" for="fd">Dato</label>
        <input class="in" id="fd" type="date">
        <label class="sr-only" for="fk">Klokkeslett</label>
        <input class="in" id="fk" type="time" value="23:59">
        <label class="pinopt"><input type="checkbox" id="fp"> Fest under kalenderen</label>
        <button class="btn light" id="fa">Legg til</button>
      </div>
      <div class="err" id="fe" role="alert"></div>
    </section>
    <section id="exPage" hidden aria-label="Eksamener">
      <div id="exWarn"></div>
      <div class="panel glass exhero" id="exHero"></div>
      <div class="dgrid" id="exGrid" style="margin-top:14px"></div>
      <div id="exDone"></div>
      <section class="panel glass" style="margin-top:14px" aria-labelledby="exfh">
        <h2 id="exfh"><svg viewBox="0 0 24 24" fill="none" stroke="#E0A86E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="exFormTitle">Legg til eksamen</span></h2>
        <div class="row">
          <div class="fld" style="flex:1 1 200px"><label for="exS">Fag</label><input class="in" id="exS" placeholder="F.eks. Software Engineering"></div>
          <div class="fld"><label for="exK">Type</label><select class="in" id="exK"><option>Skriftlig</option><option>Muntlig</option><option>Hjemmeeksamen</option><option>Annet</option></select></div>
        </div>
        <div class="row">
          <div class="fld"><label for="exD">Dato</label><input class="in" id="exD" type="date"></div>
          <div class="fld"><label for="exD2">Til dato (valgfritt)</label><input class="in" id="exD2" type="date"></div>
          <div class="fld"><label for="exT1">Start</label><input class="in" id="exT1" inputmode="numeric" autocomplete="off" placeholder="f.eks. 9" style="width:100px"></div>
          <div class="fld"><label for="exT2">Slutt</label><input class="in" id="exT2" inputmode="numeric" autocomplete="off" placeholder="f.eks. 13" style="width:100px"></div>
        </div>
        <div class="row">
          <div class="fld" style="flex:1 1 200px"><label for="exP">Sted</label><input class="in" id="exP" placeholder="F.eks. Remmen, sal A"></div>
          <div class="fld"><label for="exC">Farge</label><input class="in" id="exC" type="color" value="#F2A54A" style="width:64px;padding:4px"></div>
        </div>
        <div class="row" style="margin-top:4px"><button class="btn light" id="exAdd">Legg til</button><button class="btn" id="exCancel" hidden>Avbryt</button></div>
        <div class="err" id="exE" role="alert"></div>
      </section>
    </section>
  </main>

  <aside>
    <section class="panel glass" id="ntPanel" aria-labelledby="nth">
      <h2 id="nth"><svg viewBox="0 0 24 24" fill="none" stroke="#E9D9CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span id="ntt">Notater</span></h2>
      <label class="hint" for="na">Viktig denne uken</label>
      <textarea class="in" id="na" rows="7" placeholder="Skriv det som er viktig denne uken…"></textarea>
    </section>

    <section class="panel glass" id="acPanel" aria-label="Konto og synk">
      <div id="acct"></div>
      <div class="status" id="status" role="status"></div>
    </section>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
/* ---------- small helpers ---------- */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monOf=d=>add(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-((d.getDay()+6)%7));
const iso=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const k=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-k);const y=t.getUTCFullYear();return{y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)}};
const weekId=d=>{const i=iso(d);return i.y+"-W"+pad(i.w)};
const DN=["Søn","Man","Tir","Ons","Tor","Fre","Lør"],DL=["søn","man","tir","ons","tor","fre","lør"];
const MN=["Januar","Februar","Mars","April","Mai","Juni","Juli","August","September","Oktober","November","Desember"];
const lbl=s=>{const d=pd(s);return DL[d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toMin=s=>{const[h,m]=s.split(":").map(Number);return h*60+m};
const dur=e=>{if(!e.start||!e.end)return e.start?"Fra "+e.start:"Hele dagen";const m=toMin(e.end)-toMin(e.start);if(m<=0)return e.start+"–"+e.end;const h=Math.floor(m/60),r=m%60;return e.start+"–"+e.end+" · "+(h?h+"t":"")+(r?(h?" ":"")+r+"m":"")};
const rgb=h=>{const x=parseInt(h.slice(1),16);return[x>>16&255,x>>8&255,x&255]};
const uuid=()=>(crypto&&crypto.randomUUID)?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)});
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const PRESET=["#EF6461","#F28C4A","#F2A54A","#F2C94C","#9BCB5B","#4FC39A","#3FBFB8","#4BB7E5","#5B8DEF","#7C7FF2","#A78BFA","#EE7BB3"];

/* ---------- local data ---------- */
const CACHE="kalender-v1",QKEY="kalender-queue",VKEY="kalender-view";
// Demo-modus (#demo): oppdiktede data i minnet. Ingen database, ingen lagring, rører aldri dine ekte data.
const DEMO=location.hash==="#demo";
let data={events:{},deadlines:{},notes:{},exams:{}};
if(!DEMO){try{const c=JSON.parse(localStorage.getItem(CACHE)||"null");if(c&&c.events){data=c;if(!data.exams)data.exams={}}}catch(e){}}
let queue=[];if(!DEMO){try{queue=JSON.parse(localStorage.getItem(QKEY)||"[]")||[]}catch(e){}}
const saveLocal=()=>{if(DEMO)return;try{localStorage.setItem(CACHE,JSON.stringify(data));localStorage.setItem(QKEY,JSON.stringify(queue))}catch(e){}};

/* ---------- view state ---------- */
let n=window.innerWidth<760?3:7;
try{const v=JSON.parse(localStorage.getItem(VKEY)||"null");if(v&&(v.n===3||v.n===7))n=v.n}catch(e){}
let vs=n===7?monOf(today()):today();
let open=null,copyOpen=false,copySel=new Set(),fresh=new Set(),toastTimer=null;
let lastColor=PRESET[8];

/* ---------- sync (Supabase) ---------- */
const cfg=window.CAL_CONFIG||{};
const sb=(!DEMO&&cfg.url&&cfg.key&&window.supabase&&window.supabase.createClient)?window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let user=null,pushing=false,pushTimer=null;
const TABLE={events:"cal_events",deadlines:"cal_deadlines",notes:"cal_notes",exams:"cal_exams"};
let examsMissing=false;
const setStatus=t=>{$("status").textContent=t};
function enqueue(kind,key,op){
  if(DEMO){setStatus("Demo: ingenting lagres");return}
  const ix=queue.findIndex(q=>q.kind===kind&&q.key===key);
  const v=(ix>=0?queue[ix].v:0)+1;
  const item={kind,key,op,v};
  if(ix>=0)queue[ix]=item;else queue.push(item);
  saveLocal();
  if(!user){setStatus(sb?"Lagret på denne enheten. Logg inn for å synke.":"Lagret på denne enheten");return}
  setStatus("Lagrer…");clearTimeout(pushTimer);pushTimer=setTimeout(push,700);
}
function toRow(kind,key){
  if(kind==="events"){const e=data.events[key];return e&&{id:e.id,user_id:user.id,day:e.day,title:e.title,start_time:e.start||"",end_time:e.end||"",color:e.color,updated_at:new Date().toISOString()}}
  if(kind==="deadlines"){const f=data.deadlines[key];return f&&{id:f.id,user_id:user.id,title:f.title,due_date:f.date,due_time:f.time||"23:59",done:!!f.done,pinned:!!f.pinned,updated_at:new Date().toISOString()}}
  if(kind==="exams"){const x=data.exams[key];return x&&{id:x.id,user_id:user.id,subject:x.subject,exam_date:x.date,end_date:x.end||null,start_time:x.start||"",end_time:x.endTime||"",place:x.place||"",kind:x.kind||"Skriftlig",color:x.color,updated_at:new Date().toISOString()}}
  if(kind==="notes"){return{user_id:user.id,week_id:key,body:data.notes[key]||"",updated_at:new Date().toISOString()}}
}
async function push(){
  if(!user||pushing||!queue.length)return;
  pushing=true;let skipped=0;
  try{
    // går gjennom køen én gang; feiler bare eksamener (tabellen mangler), hoppes de over så resten likevel synkes
    for(const q of queue.slice()){
      if(!user)break;
      const v=q.v;let res;
      if(q.op==="delete"){
        res=q.kind==="notes"?await sb.from(TABLE.notes).delete().eq("week_id",q.key):await sb.from(TABLE[q.kind]).delete().eq("id",q.key);
      }else{
        const row=toRow(q.kind,q.key);
        if(!row){res={error:null}}
        else res=await sb.from(TABLE[q.kind]).upsert(row,{onConflict:q.kind==="notes"?"user_id,week_id":"id"});
      }
      if(res.error){if(q.kind==="exams"){examsMissing=true;skipped++;continue}throw res.error}
      const ix=queue.findIndex(x=>x.kind===q.kind&&x.key===q.key);
      if(ix>=0&&queue[ix].v===v)queue.splice(ix,1);
      saveLocal();
    }
    setStatus(skipped?"Synket, men eksamener venter på databasetabellen":"Synket");
    if(skipped&&page==="ex")renderExams();
    if(!skipped&&queue.length){pushing=false;return push()}
  }catch(e){
    setStatus(navigator.onLine?"Kunne ikke synke: "+(e.message||"ukjent feil"):"Frakoblet. Endringene synkes når du er på nett igjen.");
  }
  pushing=false;
}
async function fetchAll(table){
  const out=[];let from=0;
  for(;;){const r=await sb.from(table).select("*").range(from,from+999);if(r.error)throw r.error;out.push(...r.data);if(r.data.length<1000)break;from+=1000}
  return out;
}
async function pull(){
  if(!user)return;
  try{
    const[ev,dl,nt,ex]=await Promise.all([fetchAll(TABLE.events),fetchAll(TABLE.deadlines),fetchAll(TABLE.notes),fetchAll(TABLE.exams).then(r=>{examsMissing=false;return r}).catch(()=>{examsMissing=true;return null})]);
    const pend=k=>new Set(queue.filter(q=>q.kind===k).map(q=>q.key));
    const pe=pend("events"),pdl=pend("deadlines"),pn=pend("notes");
    const E={};Object.values(data.events).forEach(e=>{if(pe.has(e.id))E[e.id]=e});
    ev.forEach(r=>{if(!pe.has(r.id))E[r.id]={id:r.id,day:String(r.day),title:r.title,start:r.start_time||"",end:r.end_time||"",color:r.color}});
    const D={};Object.values(data.deadlines).forEach(f=>{if(pdl.has(f.id))D[f.id]=f});
    dl.forEach(r=>{if(!pdl.has(r.id))D[r.id]={id:r.id,title:r.title,date:String(r.due_date),time:r.due_time||"23:59",done:!!r.done,pinned:!!r.pinned}});
    const N={};Object.keys(data.notes).forEach(k=>{if(pn.has(k))N[k]=data.notes[k]});
    nt.forEach(r=>{if(!pn.has(r.week_id))N[r.week_id]=r.body||""});
    const pex=pend("exams"),X={};Object.values(data.exams||{}).forEach(x=>{if(pex.has(x.id)||!ex)X[x.id]=x});
    (ex||[]).forEach(r=>{if(!pex.has(r.id))X[r.id]={id:r.id,subject:r.subject,date:String(r.exam_date),end:r.end_date?String(r.end_date):"",start:r.start_time||"",endTime:r.end_time||"",place:r.place||"",kind:r.kind||"Skriftlig",color:r.color}});
    data={events:E,deadlines:D,notes:N,exams:X};saveLocal();renderAll();
    if(queue.length)push();else setStatus("Synket");
  }catch(e){
    setStatus(navigator.onLine?"Kunne ikke hente: "+(e.message||"ukjent feil"):"Frakoblet. Viser det som er lagret på denne enheten.");
  }
}

/* ---------- account panel ---------- */
function renderAccount(msg){
  const el=$("acct");
  if(DEMO){
    el.innerHTML='<p style="margin:0 0 6px;font-weight:700;font-size:16px">Demo</p><p class="hint" style="margin:0 0 10px">Du ser en demo med oppdiktede data. Ingenting lagres, og demoen er ikke koblet til noen database.</p><button class="btn" id="exitDemo" style="width:100%">Avslutt demo</button>';
    $("exitDemo").onclick=()=>{location.href=location.pathname};
    return;
  }
  if(!sb){el.innerHTML='<p class="hint" style="margin:0">Synk er ikke satt opp. Legg inn Supabase-detaljene i config.js.</p>';return}
  if(user){
    el.innerHTML='<p class="hint" style="margin:0 0 10px">Synker som <b style="color:var(--ink)">'+esc(user.email||"")+'</b></p><div class="row"><button class="btn" id="syncNow">Synk nå</button><button class="btn" id="logout">Logg ut</button></div>';
    $("syncNow").onclick=()=>{setStatus("Synker…");pull()};
    $("logout").onclick=async()=>{if(!confirm("Logge ut? Dataene dine ligger trygt i kontoen din."))return;await sb.auth.signOut()};
    return;
  }
  el.innerHTML='<p style="margin:0 0 10px;font-weight:700;font-size:16px">Logg inn for å synke</p>'+
    '<div class="fld" style="margin-bottom:8px"><label for="em">E-post</label><input class="in" id="em" type="email" autocomplete="email" inputmode="email"></div>'+
    '<div class="fld" style="margin-bottom:10px"><label for="pw">Passord</label><input class="in" id="pw" type="password" autocomplete="current-password"></div>'+
    '<div class="row"><button class="btn primary" id="login" style="flex:1">Logg inn</button><button class="btn" id="tryDemo" style="flex:1">Prøv demo</button></div>'+
    (msg?'<p class="'+(msg.ok?"hint":"err")+'" role="alert" style="margin:8px 0 0">'+esc(msg.text||msg)+'</p>':'');
  const go=async()=>{const em=$("em").value.trim(),pw=$("pw").value;
    if(!em||!pw){renderAccount("Skriv inn e-post og passord.");return}
    setStatus("Logger inn…");
    const{error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){renderAccount(error.message==="Invalid login credentials"?"Feil e-post eller passord.":error.message);setStatus("Lagret på denne enheten. Logg inn for å synke.")}};
  $("tryDemo").onclick=()=>{location.hash="demo"};
  $("login").onclick=go;$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
}

/* ---------- rendering ---------- */
function cardStyle(c,solid){const v=rgb(c);if(solid){const m=v.map((x,i)=>Math.round(x*.5+[42,27,18][i]*.5)).join(",");return"background:rgb("+m+");border:1px solid rgba("+v.join(",")+",.8);box-shadow:0 0 0 2px #24170F"}return"background:rgba("+v.join(",")+",.30);border:1px solid rgba("+v.join(",")+",.62)"}
function eventsOn(ds){return Object.values(data.events).filter(e=>e.day===ds).sort((a,b)=>(a.start||"00:00").localeCompare(b.start||"00:00")||a.title.localeCompare(b.title))}
function renderToolbar(){
  const end=add(vs,n-1),w=iso(vs).w;
  $("mt").textContent=MN[vs.getMonth()]+" "+vs.getFullYear();
  $("rt").textContent="Uke "+w+" · "+vs.getDate()+"."+(vs.getMonth()+1)+" – "+end.getDate()+"."+(end.getMonth()+1)+(DEMO?" · Demo":"");
  $("vw").classList.toggle("on",n===7);$("v3").classList.toggle("on",n===3);
  $("vw").setAttribute("aria-pressed",n===7);$("v3").setAttribute("aria-pressed",n===3);
  if(typeof page!=="undefined"&&page==="ex"){$("mt").textContent="Eksamener";const c=Object.values(data.exams||{}).filter(x=>exEnd(x)>=ymd(today())).length;$("rt").textContent=c?c+(c>1?" kommende eksamener":" kommende eksamen"):"Ingen kommende"}
}
const pxPerHour=()=>window.innerWidth<760?44:52;
function layoutDay(items){ // legger overlappende hendelser side om side
  const out=[];let group=[],groupEnd=-1;
  const flush=()=>{const lanes=[];group.forEach(x=>{let c=lanes.findIndex(end=>end<=x.s);if(c<0){c=lanes.length;lanes.push(0)}lanes[c]=x.e;x.col=c});
    // starter to overlappende hendelser nesten samtidig (under 15 min), deles de side om side; ellers legges den senere litt inn over den første
    const split=group.some((a,i)=>group.some((b,j)=>j>i&&a.s<b.e&&b.s<a.e&&Math.abs(a.s-b.s)<15));
    group.forEach(x=>{x.cols=lanes.length;x.split=split;out.push(x)});group=[]};
  items.sort((a,b)=>a.s-b.s||b.e-a.e).forEach(x=>{if(group.length&&x.s>=groupEnd)flush();group.push(x);groupEnd=Math.max(groupEnd,x.e)});
  if(group.length)flush();return out;
}
const timed=e=>e.start&&e.end&&toMin(e.end)>toMin(e.start);
function renderDays(){
  const el=$("days"),t=ymd(today()),PX=pxPerHour();
  el.classList.toggle("wide",n===3);
  const days=[];for(let i=0;i<n;i++){const d=add(vs,i);days.push({d,ds:ymd(d)})}
  let H0=7,H1=22;
  days.forEach(x=>eventsOn(x.ds).filter(timed).forEach(e=>{H0=Math.min(H0,Math.floor(toMin(e.start)/60));H1=Math.max(H1,Math.ceil(toMin(e.end)/60))}));
  H1=Math.min(24,H1);const H=(H1-H0)*PX,cols=(window.innerWidth<760?"30px":"44px")+" repeat("+n+",minmax(0,1fr))";
  let head='<div class="tgrid" style="grid-template-columns:'+cols+'"><div></div>',all='<div></div>',anyAll=false;
  let body='<div class="tgrid" style="grid-template-columns:'+cols+'"><div class="tlab" style="height:'+H+'px" aria-hidden="true">';
  for(let hh=H0+1;hh<H1;hh++)body+='<span style="top:'+(hh-H0)*PX+'px">'+pad(hh)+'</span>';
  body+='</div>';
  days.forEach(({d,ds})=>{
    const fl=Object.values(data.deadlines).filter(f=>!f.done&&f.date===ds).length,evs=eventsOn(ds);
    head+='<div class="dh'+(ds===t?" today":"")+'"><span class="nm">'+DN[d.getDay()]+'</span><span class="num">'+d.getDate()+'</span>'+(fl?'<span class="flag">'+(fl>1?fl+" frister":"Frist")+'</span>':"")+(examsOn(ds).length?'<span class="exflag" title="'+esc(examsOn(ds).map(x=>x.subject).join(", "))+'">Eksamen</span>':"")+'</div>';
    const ad=evs.filter(e=>!timed(e));if(ad.length)anyAll=true;
    all+='<div class="allday">'+ad.map(e=>'<button class="card ad'+(open===e.id?" sel":fresh.has(e.id)?" fresh":"")+'" draggable="true" data-id="'+e.id+'" style="'+cardStyle(e.color)+'"><span class="t">'+esc(e.title||"Uten navn")+'</span><span class="m">'+dur(e)+'</span></button>').join("")+'</div>';
    body+='<div class="tcol" data-day="'+ds+'" style="height:'+H+'px" aria-label="'+DN[d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)+'" title="Trykk for ny hendelse">';
    for(let hh=H0;hh<H1;hh++){if(hh>H0)body+='<div class="hline" style="top:'+(hh-H0)*PX+'px"></div>';body+='<div class="hline half" style="top:'+((hh-H0)*PX+PX/2)+'px"></div>'}
    if(ds===t){const now=new Date(),mm=now.getHours()*60+now.getMinutes()-H0*60;if(mm>=0&&mm<=(H1-H0)*60)body+='<div class="nowl" style="top:'+(mm/60*PX)+'px"></div>'}
    layoutDay(evs.filter(timed).map(e=>({ev:e,s:toMin(e.start),e:toMin(e.end)}))).forEach(x=>{
      const top=(x.s-H0*60)/60*PX,ht=Math.max(20,(x.e-x.s)/60*PX-2),mini=ht<38,ev=x.ev,name=esc(ev.title||"Uten navn");
      const lp=x.cols<2?0:x.split?x.col*100/x.cols:(x.col?Math.min(70,35+(x.col-1)*12):0),wp=x.cols<2?100:x.split?100/x.cols:100-lp;
      body+='<button class="card'+(mini?" mini":"")+(open===ev.id?" sel":fresh.has(ev.id)?" fresh":"")+'" draggable="true" data-id="'+ev.id+'" title="'+name+" · "+dur(ev)+'" style="top:'+(top+1)+'px;height:'+ht+'px;left:calc('+lp+'% + 2px);width:calc('+wp+'% - 4px);z-index:'+(1+x.col)+';'+cardStyle(ev.color,x.col>0&&!x.split)+'">'+
        (mini?'<span class="m">'+ev.start+'</span><span class="t">'+name+'</span>':'<span class="t">'+name+'</span><span class="m">'+dur(ev)+'</span>')+'</button>';
    });
    body+='</div>';
  });
  el.innerHTML=head+'</div>'+(anyAll?'<div class="tgrid allrow" style="grid-template-columns:'+cols+'">'+all+'</div>':'')+body+'</div>';
  el.dataset.h0=H0;el.dataset.px=PX;
}
function badge(f){
  if(f.done)return'<span class="badge ok">Levert</span>';
  const x=Math.round((pd(f.date)-today())/864e5);
  if(x<0)return'<span class="badge red">'+(-x)+" d over fristen</span>";
  if(x===0)return'<span class="badge red">I dag</span>';
  if(x===1)return'<span class="badge amb">I morgen</span>';
  return'<span class="badge '+(x<=3?"amb":"calm")+'">Om '+x+" dager</span>";
}
function renderDeadlines(){
  const m=monOf(vs),me=add(m,6),inWk=f=>{const d=pd(f.date);return d>=m&&d<=me};
  const all=Object.values(data.deadlines);
  const list=all.filter(f=>f.pinned||inWk(f)).sort((a,b)=>(a.done-b.done)||(a.date+a.time).localeCompare(b.date+b.time));
  const hidden=all.filter(f=>!f.done&&!f.pinned&&!inWk(f)).length,pinned=list.filter(f=>f.pinned).length;
  $("dlsub").textContent=[list.length?list.length+" vises":"",pinned?pinned+" festet":"",hidden?hidden+" i andre uker":""].filter(Boolean).join(" · ");
  const PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3H7l3-3-1-5z"/><path d="M12 15v5"/></svg>';
  const CHK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>';
  $("dls").innerHTML=list.length?list.map(f=>'<article class="dcard'+(f.done?" done":"")+(f.pinned?" pinned":"")+'"><div class="dtop"><button class="chk" data-f="'+f.id+'" aria-label="'+(f.done?"Marker som ikke levert":"Marker som levert")+'">'+(f.done?CHK:"")+'</button><div class="row" style="gap:2px"><button class="pin'+(f.pinned?" on":"")+'" data-p="'+f.id+'" aria-pressed="'+!!f.pinned+'" aria-label="'+(f.pinned?"Løsne fra kalenderen":"Fest under kalenderen")+'" title="'+(f.pinned?"Festet: vises hver uke":"Vises bare i uka med frist")+'">'+PIN+'</button><button class="x" data-x="'+f.id+'" aria-label="Slett frist">'+X+'</button></div></div><b class="dtitle">'+esc(f.title)+'</b><span class="dwhen">'+lbl(f.date)+" kl. "+esc(f.time)+'</span>'+badge(f)+'</article>').join(""):'<p class="hint" style="margin:0">Ingen frister denne uken.</p>';
}
function renderNotes(){
  const k=weekId(vs);$("ntt").textContent="Notater for uke "+iso(vs).w;
  const na=$("na");if(document.activeElement!==na)na.value=data.notes[k]||"";
}
function renderAll(){renderToolbar();renderDays();renderDeadlines();renderNotes();renderExams();if(open&&!data.events[open]){open=null;renderEditor()}}

/* ---------- editor ---------- */
function usedColors(){const a=[];Object.values(data.events).forEach(e=>{const c=(e.color||"").toLowerCase();if(c&&!a.includes(c))a.push(c)});return a}
function renderEditor(){
  const el=$("ed"),e=open&&data.events[open];
  if(!e){el.innerHTML="";return}
  el.innerHTML='<section class="editor" aria-label="Rediger hendelse">'+
    '<div class="fields"><div class="fld grow"><label for="et">Navn</label><input class="in title" id="et"></div>'+
